<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Find My Smell">
  <!--
    Иконка вкладки. ЗАГЛУШКА: в проде favicon свой, но он лежит в CDN
    Webflow, а не в репозитории, и в песочнице до его байтов не добраться.
    Здесь простая фигура в цветах сайта: капля на угольном фоне
    (--charcoal-950 #141917 и терракота #D03D01 из палитры главной).
    Когда заказчица даст настоящий знак — заменить этот файл, больше
    ничего трогать не нужно.
  -->
  <rect width="64" height="64" rx="14" fill="#141917"/>
  <path d="M32 13c7.8 9.2 12 15.6 12 21.4C44 42.3 38.6 48 32 48s-12-5.7-12-13.6C20 28.6 24.2 22.2 32 13z"
        fill="#D03D01"/>
  <path d="M32 40.5c-3.1 0-5.6-2.6-5.6-6 0-1.8.7-3.6 2-5.6.7 4.4 2.6 7 5.4 7.8-1 1-1.6 2.3-1.8 3.8z"
        fill="#EBE4CF" opacity="0.85"/>
</svg>
