<style>
#daytday-layout {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #c0c0ac;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 80px 20px 52px;
  box-sizing: border-box;
  overflow-y: auto;
  overflow-x: hidden;
}

#daytday-question {
  font-family: 'HIGHCRUISER', 'Arial Black', Arial;
  font-size: clamp(18px, 3vw, 36px);
  color: #8B3A22;
  letter-spacing: 0.08em;
  white-space: normal;
  word-break: break-word;
  pointer-events: none;
  z-index: 10;
  text-align: center;
  width: 100%;
  max-width: 800px;
  line-height: 1.4;
  margin-bottom: 24px;
  flex-shrink: 0;
}

.daytday-option {
  font-family: 'Inconsolata', 'Arial Black', Arial;
  text-transform: none;
  font-size: clamp(13px, 2.8vw, 30px);
  color: #272727;
  letter-spacing: 0.06em;
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  white-space: normal;
  word-break: break-word;
  max-width: 88vw;
  will-change: transform;
  padding: 10px 0;
}
.daytday-option.dimmed {
  opacity: 0.15 !important;
}

#vortex-canvas {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

@media (max-width: 480px) {
  .daytday-option {
    font-size: clamp(12px, 4.5vw, 20px);
    white-space: normal;
    max-width: 88vw;
  }

  #daytday-question {
  font-size: clamp(13px, 4vw, 18px);
  top: 100px;
  letter-spacing: 0.04em;
  white-space: normal;
  width: 90vw;
  max-width: 90vw;
  line-height: 1.4;
}
  #daytday-layout {
    padding: 70px 12px 16px;
    gap: 2px;
  }
}
</style>

<script>
(function() {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9997;opacity:0.07;mix-blend-mode:overlay;';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  let last = 0;
  function loop(ts) {
    if (ts - last > 80) {
      const img = ctx.createImageData(cvs.width, cvs.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      last = ts;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
(function() {

const options = [
  { key: 'Q_DAYTDAY__FLOW',     text: 'I go with the flow' },
  { key: 'Q_DAYTDAY__PLANDAY',  text: 'I like to have a plan' },
  { key: 'Q_DAYTDAY__INTERACT', text: 'I spend my day with people' },
  { key: 'Q_DAYTDAY__CHANGDAY', text: 'My days change a lot' },
  { key: 'Q_DAYTDAY__ACTIVED',  text: "I don't like to stay still" },
  { key: 'Q_DAYTDAY__CONSIST',  text: 'I prefer calm stable days' },
];

  const pastaConfigs = options.map(() => ({
    startX: (Math.random() - 0.5) * 500,
    startRot: (Math.random() - 0.5) * 70,
    delay: Math.random() * 350 + Math.random() * 150,
    duration: 520 + Math.random() * 220,
  }));

  const layout = document.createElement('div');
  layout.id = 'daytday-layout';

  const questionEl = document.createElement('div');
  questionEl.id = 'daytday-question';
  questionEl.textContent = 'WHEN YOU IMAGINE YOUR IDEAL DAY, WHICH FEELS MOST LIKE YOU?';
  layout.appendChild(questionEl);

  const vortexCanvas = document.createElement('canvas');
  vortexCanvas.id = 'vortex-canvas';
  layout.appendChild(vortexCanvas);

  const optionEls = {};
  const isMobile = () => window.matchMedia('(hover: none)').matches;
  let activeTouchKey = null;
  let isAnimating = false;

  options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'daytday-option';
    el.textContent = opt.text;
    el.style.transform = `translateX(${pastaConfigs[i].startX}px) rotate(${pastaConfigs[i].startRot}deg) translateY(-600px)`;
    layout.appendChild(el);
    optionEls[opt.key] = el;
  });

  document.body.appendChild(layout);

  function startFallAnimation() {
    options.forEach((opt, i) => {
      const el = optionEls[opt.key];
      const cfg = pastaConfigs[i];
      setTimeout(() => {
        el.style.transition = `transform ${cfg.duration}ms cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease`;
        el.style.transform = `translateX(${cfg.startX * 0.12}px) rotate(${cfg.startRot * 0.12}deg) translateY(12px)`;
        el.style.opacity = '1';
        setTimeout(() => {
          el.style.transition = 'transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)';
          el.style.transform = 'translateX(0px) rotate(0deg) translateY(-5px)';
          setTimeout(() => {
            el.style.transition = 'transform 0.15s ease';
            el.style.transform = 'translateX(0px) rotate(0deg) translateY(0px)';
          }, 220);
        }, cfg.duration);
      }, cfg.delay);
    });
  }

  function triggerParticleDissolve(selectedKey, callback) {
    const cvs = vortexCanvas;
    const ctx = cvs.getContext('2d');
    cvs.width  = window.innerWidth;
    cvs.height = window.innerHeight;

    const selectedEl = optionEls[selectedKey];
    const rect = selectedEl.getBoundingClientRect();
    const fontSize = parseInt(window.getComputedStyle(selectedEl).fontSize);
    const text = selectedEl.textContent.trim();

    Object.values(optionEls).forEach(el => {
      el.style.transition = 'opacity 0.15s ease';
      el.style.opacity = '0';
    });

    const off = document.createElement('canvas');
    const PAD = 40;
    off.width  = rect.width  + PAD * 2;
    off.height = rect.height + PAD * 2;
    const oc = off.getContext('2d');
    oc.font = `bold ${fontSize}px HIGHCRUISER, Arial Black, Arial`;
    oc.fillStyle = '#e6e5dd';
    oc.textAlign = 'center';
    oc.textBaseline = 'middle';
    oc.fillText(text, off.width / 2, off.height / 2);

    const imgData = oc.getImageData(0, 0, off.width, off.height);
    const particles = [];
    const STEP = Math.max(2, Math.floor(fontSize / 8));

    for (let y = 0; y < off.height; y += STEP) {
      for (let x = 0; x < off.width; x += STEP) {
        const i = (y * off.width + x) * 4;
        if (imgData.data[i + 3] > 80) {
          const wx = rect.left - PAD + x;
          const wy = rect.top  - PAD + y;
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 4.5;
          particles.push({
            x: wx, y: wy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.2,
            alpha: 1,
            size: STEP * (0.8 + Math.random() * 1.2),
            spin: (Math.random() - 0.5) * 0.3,
            rot: Math.random() * Math.PI * 2,
            r: imgData.data[i],
            g: imgData.data[i + 1],
            b: imgData.data[i + 2],
          });
        }
      }
    }

    let frame = 0;
    const TOTAL = 55;
    setTimeout(callback, 900);

    function animate() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const progress = frame / TOTAL;
      particles.forEach(p => {
        p.x   += p.vx;
        p.y   += p.vy;
        p.vy  += 0.12;
        p.vx  *= 0.97;
        p.rot += p.spin;
        p.alpha = Math.max(0, 1 - progress * 1.4);
        if (p.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      frame++;
      if (frame < TOTAL) requestAnimationFrame(animate);
      else ctx.clearRect(0, 0, cvs.width, cvs.height);
    }
    animate();
  }

  function dimOthers(activeKey) {
    Object.entries(optionEls).forEach(([k, el]) => {
      if (k === activeKey) el.classList.remove('dimmed');
      else el.classList.add('dimmed');
    });
  }

  function resetAll() {
    Object.values(optionEls).forEach(el => el.classList.remove('dimmed'));
    activeTouchKey = null;
  }

function selectAnswer(key) {
  if (isAnimating) return;
  isAnimating = true;
  const btn = document.querySelector('[data-answer-key="' + key + '"]');
  if (btn) btn.click();
}

  options.forEach(opt => {
    const el = optionEls[opt.key];

    el.addEventListener('mouseenter', () => {
      if (isMobile()) return;
      dimOthers(opt.key);
    });
    el.addEventListener('mouseleave', () => {
      if (isMobile()) return;
      resetAll();
    });
    el.addEventListener('click', (e) => {
      if (isMobile()) return;
      e.stopImmediatePropagation();
      selectAnswer(opt.key);
    });
    el.addEventListener('touchstart', (e) => {
      if (!isMobile()) return;
      if (activeTouchKey !== opt.key) {
        e.preventDefault();
        activeTouchKey = opt.key;
        dimOthers(opt.key);
      }
    }, { passive: false });
    el.addEventListener('touchend', (e) => {
      if (!isMobile()) return;
      if (activeTouchKey === opt.key) {
        if (!el.classList.contains('dimmed')) {
          e.preventDefault();
          selectAnswer(opt.key);
        }
      }
    }, { passive: false });
  });

  document.addEventListener('touchstart', (e) => {
    if (!isMobile()) return;
    const tapped = e.target.closest('.daytday-option');
    if (!tapped) resetAll();
  });

  startFallAnimation();

})();
</script>

<script>
(function() {

  /* ── AMBIENT INK BLOBS BACKGROUND ── */
  const blobCvs = document.createElement('canvas');
  blobCvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;';
const daytdayLayout = document.getElementById('daytday-layout') || document.body;
daytdayLayout.appendChild(blobCvs);
  const bctx = blobCvs.getContext('2d');
  let BW, BH;

  function resizeBlob() {
    BW = blobCvs.width  = window.innerWidth;
    BH = blobCvs.height = window.innerHeight;
  }
  resizeBlob();
  window.addEventListener('resize', resizeBlob);

const blobs = [
    { x: 0.15, y: 0.75, r: 0.28, vx:  0.00026, vy: -0.00013, phase: 0.0,  color: 'rgba(139,58,34,'  },  
    { x: 0.85, y: 0.25, r: 0.22, vx: -0.00015, vy:  0.00015, phase: 1.8,  color: 'rgba(61,61,32,'     },  
    { x: 0.50, y: 0.10, r: 0.14, vx:  0.00019, vy:  0.00026, phase: 3.2,  color: 'rgba(139,58,34,'  },  
    { x: 0.75, y: 0.88, r: 0.18, vx: -0.00019, vy: -0.00014, phase: 4.5,  color: 'rgba(139,58,34,'      },  
    { x: 0.25, y: 0.40, r: 0.10, vx:  0.00027, vy:  0.00019, phase: 2.1,  color: 'rgba(61,61,32,'  },  
  ];

  let bt = 0;
  let stopped = false;
  let globalAlpha = 1;

  function blobLoop() {
    bctx.clearRect(0, 0, BW, BH);

    if (stopped) {
      globalAlpha = Math.max(0, globalAlpha - 0.018);
    }

    blobs.forEach(b => {
      if (!stopped) {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -b.r) b.x = 1 + b.r;
        if (b.x > 1 + b.r) b.x = -b.r;
        if (b.y < -b.r) b.y = 1 + b.r;
        if (b.y > 1 + b.r) b.y = -b.r;
      }

      const cx  = b.x * BW;
      const cy  = b.y * BH;
      const rad = b.r * Math.min(BW, BH);
      const wobble = 1 + Math.sin(bt * 0.3 + b.phase) * 0.06;

      const grad = bctx.createRadialGradient(cx, cy, 0, cx, cy, rad * wobble);
      grad.addColorStop(0,   b.color + (0.55 * globalAlpha) + ')');
      grad.addColorStop(0.5, b.color + (0.25 * globalAlpha) + ')');
      grad.addColorStop(1,   b.color + '0)');

      bctx.beginPath();
      bctx.ellipse(
        cx, cy,
        rad * wobble,
        rad / wobble,
        Math.sin(bt * 0.15 + b.phase) * 0.4,
        0, Math.PI * 2
      );
      bctx.fillStyle = grad;
      bctx.fill();
    });

    bt += 0.008;

    if (globalAlpha > 0) {
      requestAnimationFrame(blobLoop);
    }
  }

  blobLoop();

  /* ── STOP BLOBS ON ANSWER SELECT ── */
  /* Listen for any answer click — blobs fade out */
  document.addEventListener('click', function handler(e) {
    if (e.target.closest('.daytday-option') || e.target.closest('[data-answer-key]')) {
      stopped = true;
      document.removeEventListener('click', handler);
    }
  });

  /* Also catch touchend on mobile */
  document.addEventListener('touchend', function handler(e) {
    if (e.target.closest('.daytday-option')) {
      stopped = true;
      document.removeEventListener('touchend', handler);
    }
  }, { passive: true });

})();
</script>
