<script>
(function() {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9997;opacity:0.07;mix-blend-mode:overlay;';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  let last = 0;
  function loop(ts) {
    if (ts - last > 80) {
      const img = ctx.createImageData(cvs.width, cvs.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      last = ts;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
(function () {
  var ANSWER_KEY = 'Q_REGION_NOW';
  var NEXT_PAGE  = '/q-generation';

  var COUNTRIES = [
    'Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda',
    'Argentina','Armenia','Australia','Austria','Azerbaijan','Bahamas','Bahrain',
    'Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia',
    'Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso',
    'Burundi','Cabo Verde','Cambodia','Cameroon','Canada','Central African Republic',
    'Chad','Chile','China','Colombia','Comoros','Congo','Costa Rica','Croatia','Cuba',
    'Cyprus','Czech Republic','Denmark','Djibouti','Dominica','Dominican Republic',
    'Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia',
    'Eswatini','Ethiopia','Fiji','Finland','France','Gabon','Gambia','Georgia',
    'Germany','Hong Kong (SAR China)','Ghana','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau',
    'Guyana','Haiti','Honduras','Hungary','Iceland','India','Indonesia','Iran','Iraq',
    'Ireland','Israel','Italy','Jamaica','Japan','Jordan','Kazakhstan','Kenya',
    'Kiribati','Kuwait','Kyrgyzstan','Laos','Latvia','Lebanon','Lesotho','Liberia',
    'Libya','Liechtenstein','Lithuania','Luxembourg','Madagascar','Malawi','Malaysia',
    'Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico',
    'Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique',
    'Myanmar','Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua',
    'Niger','Nigeria','North Korea','North Macedonia','Norway','Oman','Pakistan',
    'Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines',
    'Poland','Portugal','Qatar','Romania','Russia','Rwanda','Saint Kitts and Nevis',
    'Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino',
    'Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles',
    'Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia',
    'South Africa','South Korea','South Sudan','Spain','Sri Lanka','Sudan',
    'Suriname','Sweden','Switzerland','Syria','Taiwan','Tajikistan','Tanzania',
    'Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia',
    'Turkey','Turkmenistan','Tuvalu','Uganda','Ukraine','United Arab Emirates',
    'United Kingdom','United States','Uruguay','Uzbekistan','Vanuatu','Vatican City',
    'Venezuela','Vietnam','Yemen','Zambia','Zimbabwe'
  ];

  var input  = document.getElementById('fms-rn-input');
  var list   = document.getElementById('fms-rn-list');

  function renderList(filter) {
    var q = (filter || '').toLowerCase().trim();
    var matches = q
      ? COUNTRIES.filter(function(c) { return c.toLowerCase().indexOf(q) !== -1; })
      : COUNTRIES;
    list.innerHTML = matches.length
      ? matches.map(function(c) {
          return '<div class="fms-rn-item" data-value="' + c + '">' + c + '</div>';
        }).join('')
      : '<div class="fms-rn-none">No results</div>';
    list.style.display = 'block';
  }

  function saveAndNavigate(country) {
    var answers = {};
    try {
      answers = JSON.parse(
        sessionStorage.getItem('quiz_answers') ||
        localStorage.getItem('quiz_answers') || '{}'
      );
    } catch(e) {}
    answers[ANSWER_KEY] = country;
    var json = JSON.stringify(answers);
    sessionStorage.setItem('quiz_answers', json);
    localStorage.setItem('quiz_answers', json);
    window.location.href = NEXT_PAGE;
  }

  input.addEventListener('input', function() { renderList(this.value); });
  input.addEventListener('focus', function() { renderList(this.value); });

  list.addEventListener('mousedown', function(e) {
    var item = e.target.closest('.fms-rn-item');
    if (item) saveAndNavigate(item.getAttribute('data-value'));
  });

  document.addEventListener('click', function(e) {
    if (!document.getElementById('fms-rn-outer').contains(e.target)) {
      list.style.display = 'none';
    }
  });
})();
</script>
