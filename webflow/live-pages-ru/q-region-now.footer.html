<script>
(function() {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9997;opacity:0.07;mix-blend-mode:overlay;';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  let last = 0;
  function loop(ts) {
    if (ts - last > 80) {
      const img = ctx.createImageData(cvs.width, cvs.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      last = ts;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>

  var ANSWER_KEY = 'Q_REGION_NOW';
  var NEXT_PAGE = '/ru/q-generation';

var COUNTRIES = [

    'Босния и Герцеговина','Ботсвана','Бразилия','Бруней','Буркина-Фасо','Бурунди',
    'Бутан','Вануату','Ватикан','Великобритания','Венгрия','Венесуэла','Вьетнам',
    'Габон','Гаити','Гайана','Гамбия','Гана','Гватемала','Гвинея','Гвинея-Бисау',
    'Германия','Гондурас','Гонконг (САР Китая)','Гренада','Греция','Грузия','Дания','Джибути','Доминика',
    'Доминиканская Республика','Египет','Замбия','Зимбабве','Израиль','Индия',
    'Индонезия','Иордания','Ирак','Иран','Ирландия','Исландия','Испания','Италия',
    'Йемен','Кабо-Верде','Казахстан','Камбоджа','Камерун','Канада','Катар','Кения',
    'Кипр','Кирибати','Китай','Колумбия','Коморы','Конго','Коста-Рика','Кот-д\'Ивуар',
    'Куба','Кувейт','Кыргызстан','Лаос','Латвия','Лесото','Либерия','Ливан',
    'Ливия','Литва','Лихтенштейн','Люксембург','Маврикий','Мавритания','Мадагаскар',
    'Малави','Малайзия','Мальдивы','Мали','Мальта','Маршалловы острова','Мексика',
    'Микронезия','Мозамбик','Молдова','Монако','Монголия','Мьянма','Намибия',
    'Науру','Непал','Нигер','Нигерия','Нидерланды','Никарагуа','Новая Зеландия',
    'Норвегия','ОАЭ','Оман','Пакистан','Палау','Палестина','Панама',
    'Папуа — Новая Гвинея','Парагвай','Перу','Польша','Португалия','Республика Корея',
    'Россия','Руанда','Румыния','Сальвадор','Самоа','Сан-Марино',
    'Сан-Томе и Принсипи','Саудовская Аравия','Северная Корея','Северная Македония',
    'Сейшелы','Сенегал','Сент-Винсент и Гренадины','Сент-Китс и Невис',
    'Сент-Люсия','Сербия','Сингапур','Сирия','Словакия','Словения',
    'Соломоновы острова','Сомали','Судан','Суринам','США','Сьерра-Леоне',

    'Узбекистан','Украина','Уругвай','Фиджи','Филиппины','Финляндия','Франция',
    'Хорватия','Центральноафриканская Республика','Чад','Черногория',
    'Чехия','Чили','Швейцария','Швеция','Шри-Ланка','Эквадор',
    'Экваториальная Гвинея','Эритрея','Эсватини','Эстония','Эфиопия',
    'Южный Судан','Ямайка','Япония'
  ];

  var input  = document.getElementById('fms-rn-input');
  var list   = document.getElementById('fms-rn-list');

  function renderList(filter) {
    var q = (filter || '').toLowerCase().trim();
    var matches = q
      ? COUNTRIES.filter(function(c) { return c.toLowerCase().indexOf(q) !== -1; })
      : COUNTRIES;
    list.innerHTML = matches.length
      ? matches.map(function(c) {
          return '<div class="fms-rn-item" data-value="' + c + '">' + c + '</div>';
        }).join('')
      : '<div class="fms-rn-none">NНичего не найдено</div>';
    list.style.display = 'block';
  }

  function saveAndNavigate(country) {
    var answers = {};
    try {
      answers = JSON.parse(
        sessionStorage.getItem('quiz_answers') ||
        localStorage.getItem('quiz_answers') || '{}'
      );
    } catch(e) {}
    answers[ANSWER_KEY] = country;
    var json = JSON.stringify(answers);
    sessionStorage.setItem('quiz_answers', json);
    localStorage.setItem('quiz_answers', json);
    window.location.href = NEXT_PAGE;
  }

  input.addEventListener('input', function() { renderList(this.value); });
  input.addEventListener('focus', function() { renderList(this.value); });

  list.addEventListener('mousedown', function(e) {
    var item = e.target.closest('.fms-rn-item');
    if (item) saveAndNavigate(item.getAttribute('data-value'));
  });

  document.addEventListener('click', function(e) {
    if (!document.getElementById('fms-rn-outer').contains(e.target)) {
      list.style.display = 'none';
    }
  });
})();
</script>
