<script>
(function() {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9997;opacity:0.07;mix-blend-mode:overlay;';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  let last = 0;
  function loop(ts) {
    if (ts - last > 80) {
      const img = ctx.createImageData(cvs.width, cvs.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      last = ts;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const overlay = document.createElement('div');
  overlay.id = 'open-answer-overlay';
  overlay.style.cssText = `display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;`;
overlay.innerHTML = `<div style="background:rgba(255,255,255,0.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.25);border-radius:28px;padding:48px 36px 40px;max-width:480px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3);position:relative;"><button id="open-answer-close" style="position:absolute;top:16px;right:20px;background:none;border:none;color:rgba(255,255,255,0.6);font-size:22px;cursor:pointer;line-height:1;padding:4px;">✕</button><p style="font-family:Georgia,serif;font-size:20px;margin-bottom:28px;color:#fff;letter-spacing:0.02em;line-height:1.5;">À quelle odeur associez vous le mystère ?</p><input id="open-answer-input" type="text" placeholder="Écrivez votre réponse..." style="width:100%;padding:16px 20px;font-size:16px;font-family:Georgia,serif;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.35);border-radius:50px;outline:none;color:#fff;box-sizing:border-box;letter-spacing:0.03em;"><button id="open-answer-submit" style="margin-top:16px;width:100%;padding:16px;background:rgba(255,255,255,0.18);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:50px;font-size:14px;cursor:pointer;font-family:Georgia,serif;letter-spacing:0.14em;text-transform:uppercase;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.28)'" onmouseout="this.style.background='rgba(255,255,255,0.18)'">Continuer →</button></div>`;
  document.body.appendChild(overlay);
  function attachOpenAnswerListener() {
    const btn = document.querySelector('[data-open-answer="true"]');
    if (!btn) return;
    btn.addEventListener('click', function(e) {
      e.preventDefault(); e.stopImmediatePropagation();
      overlay.style.display = 'flex';
      setTimeout(() => document.getElementById('open-answer-input').focus(), 50);
    });
  }
  attachOpenAnswerListener();

  document.getElementById('open-answer-close').addEventListener('click', function() {
    overlay.style.display = 'none';
  });

  document.getElementById('open-answer-submit').addEventListener('click', function() {
    const text = document.getElementById('open-answer-input').value.trim();
    if (!text) return;

    sessionStorage.setItem('quiz_open', text);
    localStorage.setItem('quiz_open', text);

    const answers = JSON.parse(sessionStorage.getItem('quiz_answers') || '{}');
    answers['Q_MYST'] = 'Q_MYST__OTHER';
    sessionStorage.setItem('quiz_answers', JSON.stringify(answers));
    localStorage.setItem('quiz_answers', JSON.stringify(answers));

    const path = window.location.pathname;
    const prefix = path.startsWith('/fr/') ? '/fr' : path.startsWith('/ru/') ? '/ru' : '';
    window.location.href = prefix + '/q-env-child';
  });

  document.getElementById('open-answer-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('open-answer-submit').click(); });
});
</script>

<script>
(function() {

  const imageMap = {
    'Q_MYST__SMOKE':      'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b847885b4a52c01f6dc9a1_myst-smoke.png',
    'Q_MYST__STARS':      'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b8478843b2b00b022dec3b_myst-sky.png',
    'Q_MYST__ANTIQU':     'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b84788dd9f7fd1b5be52a6_myst-antiq.png',
    'Q_MYST__UNFAMIL':    'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b847882e7f74ccc4627fcc_myst-unfamil.png',
    'Q_MYST__OLD_BOOK':   'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b84788efee6ad8fa626c30_myst-books.png',
    'Q_MYST__MYST_SPICE': 'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b847886ff3790e9c07b537_myst-spice.png',
    'Q_MYST__OLD_PLACES': 'https://cdn.prod.website-files.com/69773aa3fded0e0107b28cbd/69b84788477d41700d61adc2_myst-house.png',
  };

  Object.values(imageMap).forEach(url => {
    const img = new Image();
    img.src = url;
  });

  const isMobile = () => window.matchMedia('(hover: none)').matches;
  let activeTouchKey = null;

  const buttons = document.querySelectorAll('[data-answer-key^="Q_MYST"]');

  function applyImage(btn) {
    const key = btn.getAttribute('data-answer-key');
    const url = imageMap[key];
    if (url) {
      btn.style.backgroundImage = `url('${url}')`;
      btn.style.backgroundSize = 'cover';
      btn.style.backgroundPosition = 'center';
    }
  }

  function activateButton(activeBtn) {
    buttons.forEach(b => {
      if (b === activeBtn) {
        b.style.transform = 'scale(1.04)';
        b.style.opacity = '1';
        b.style.zIndex = '2';
      } else {
        b.style.transform = 'scale(1)';
        b.style.opacity = '0.4';
        b.style.zIndex = '1';
      }
      b.style.transition = 'transform 200ms ease, opacity 200ms ease';
    });
  }

  function resetAll() {
    buttons.forEach(b => {
      b.style.transform = 'scale(1)';
      b.style.opacity = '1';
      b.style.zIndex = '1';
    });
  }

  buttons.forEach(btn => {
    applyImage(btn);

    btn.addEventListener('mouseenter', () => {
      if (isMobile()) return;
      activateButton(btn);
    });

    btn.addEventListener('mouseleave', () => {
      if (isMobile()) return;
      resetAll();
    });

    btn.addEventListener('touchstart', (e) => {
      if (!isMobile()) return;
      const key = btn.getAttribute('data-answer-key');
      if (activeTouchKey !== key) {
        e.preventDefault();
        activeTouchKey = key;
        activateButton(btn);
      }
    }, { passive: false });
  });

  document.addEventListener('touchstart', (e) => {
    if (!isMobile()) return;
    const tapped = e.target.closest('[data-answer-key^="Q_MYST"]');
    if (!tapped) {
      activeTouchKey = null;
      resetAll();
    }
  });

})();
</script>
