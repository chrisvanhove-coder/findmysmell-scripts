<!--
     FIND MY SMELL — RESULT PAGE CSS (v6)

         mobile tap delay, tightened animation to 0.2s / 130px (was 0.25s / 200px),

<style>
[data-result] {
  display: none !important;
  flex-direction: column !important;
  width: 100% !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow: visible !important;
  justify-content: flex-start !important;
  align-items: stretch !important;
}

[data-result][style*="flex"] {
  display: flex !important;
  height: auto !important;
}

/* ── Hide old Webflow panels ── */
.div-block-16, .div-block-17,
.div-block-18, .div-block-19,
.div-block-20, .div-block-21,
.div-block-22, .div-block-23,
.div-block-24, .div-block-25,
.div-block-26, .div-block-27,
.div-block-28, .div-block-29 {
  display: none !important;
  height: 0 !important;
  min-height: 0 !important;
  overflow: hidden !important;
}

/* ── Zone base ── */
.fms-zone { width: 100%; }

/* ── Force backgrounds on all zones ── */
.fms-z1 { background-color: var(--z1-bg) !important; color: #fff !important; }
.fms-z2 { background-color: var(--z2-bg) !important; color: var(--z2-color) !important; position: relative; }
.fms-z3 { background-color: var(--z3-bg) !important; color: var(--z3-color) !important; }
.fms-z4 { background-color: var(--z4-bg) !important; color: var(--z4-color) !important; }
.fms-z5 { background-color: var(--z5-bg) !important; color: var(--z5-color) !important; }

/* ═══════════════════════════════════════
   ZONE 1: SCENT DNA — wrapper
   ═══════════════════════════════════════ */
.fms-z1-dna {
  min-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 6vw;
}

.fms-z1-dna-title {
  font-family: 'HIGHCRUISER', 'Arial Black', Arial;
  font-size: clamp(36px, 7vw, 72px);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
  text-align: center;
  margin-bottom: clamp(32px, 5vh, 60px);
  line-height: 1;
}

/* ═══════════════════════════════════════
   PERSONALITY SECTION — texture flashlight
   ═══════════════════════════════════════ */
.fms-personality-reveal {
  position: relative;
  overflow: hidden;
  border-top: 1px solid rgba(126,61,48,0.12);
  background-color: var(--z2-bg) !important;
  color: var(--z2-color) !important;
}

.fms-personality-reveal::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 100px 60px var(--z2-bg);
  z-index: 2;
  pointer-events: none;
}

.fms-personality-texture {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url('https://res.cloudinary.com/dcefrxxav/image/upload/v1787817113/textured-wall_sh9lpw.png');
  background-size: cover;
  background-position: center;
  z-index: 1;
  pointer-events: none;
  opacity: 0.35;
  mix-blend-mode: multiply;
  -webkit-mask-image:
    radial-gradient(circle 160px at var(--mx, -300px) var(--my, -300px), black 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.1) 70%, transparent 100%),
    radial-gradient(circle 120px at var(--mx1, -300px) var(--my1, -300px), rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 50%, transparent 100%),
    radial-gradient(circle 90px at var(--mx2, -300px) var(--my2, -300px), rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.05) 50%, transparent 100%),
    radial-gradient(circle 60px at var(--mx3, -300px) var(--my3, -300px), rgba(0,0,0,0.1) 0%, transparent 80%);
  mask-image:
    radial-gradient(circle 160px at var(--mx, -300px) var(--my, -300px), black 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.1) 70%, transparent 100%),
    radial-gradient(circle 120px at var(--mx1, -300px) var(--my1, -300px), rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 50%, transparent 100%),
    radial-gradient(circle 90px at var(--mx2, -300px) var(--my2, -300px), rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.05) 50%, transparent 100%),
    radial-gradient(circle 60px at var(--mx3, -300px) var(--my3, -300px), rgba(0,0,0,0.1) 0%, transparent 80%);
}

.fms-personality-content {
  position: relative;
  z-index: 3;
  max-width: 750px;
  margin: 0 auto;
  padding: 80px 24px 100px;
}

.fms-personality-para {
  font-family: Georgia, serif;
  font-size: clamp(18px, 2.8vw, 26px);
  line-height: 1.75;
  opacity: 0.8;
  margin-bottom: 40px;
}

.fms-personality-para:last-child { margin-bottom: 0; }

.fms-personality-closer {
  font-family: Georgia, serif;
  font-size: clamp(18px, 2.8vw, 26px);
  line-height: 1.75;
  font-style: italic;
  opacity: 0.55;
  margin-top: 48px;
  text-align: center;
}

/* ═══════════════════════════════════════
   SCENT DNA — expandable river diagram
   ═══════════════════════════════════════ */
.fms-dna-quote {
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(18px, 4.5vw, 24px);
  color: #fff;
  font-weight: 700;
  line-height: 1.4;
  max-width: 420px;
  margin: 0 auto 40px;
  opacity: 0.95;
}

.fms-dna-diagram { position: relative; max-width: 480px; margin: 0 auto; }

.fms-dna-row { position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.fms-dna-row-bar {
  display: flex;
  align-items: center;
  padding: 16px 0;
  position: relative;
  z-index: 2;
}

.fms-dna-label {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  min-width: 62px;
  transition: color 0.3s;
}
.fms-dna-label.right { text-align: right; }
.fms-dna-row.active .fms-dna-label { color: rgba(255,255,255,0.85); }

.fms-dna-track { flex: 1; height: 1px; background: rgba(255,255,255,0.15); position: relative; margin: 0 8px; }

.fms-dna-dot-ghost { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.13); }
.fms-dna-dot-outer { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.fms-dna-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0.9; }

.fms-dna-expand {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
  opacity: 0;
  position: relative;
  z-index: 2;
}
.fms-dna-row.active .fms-dna-expand {
  max-height: 130px;
  opacity: 1;
  transition: max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease 0.03s;
}

.fms-dna-expand-inner { padding: 0 4px 24px; }
.fms-dna-explain-grid { display: flex; gap: 16px; align-items: flex-start; }
.fms-dna-explain-side { flex: 1; }
.fms-dna-explain-word { font-family: 'Inconsolata', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 5px; }
.fms-dna-explain-desc { font-family: Georgia, serif; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.6); }
.fms-dna-explain-divider { width: 1px; background: rgba(255,255,255,0.15); align-self: stretch; flex-shrink: 0; margin: 2px 0; }

.fms-dna-tap-hint {
  font-family: 'Inconsolata', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.28);
  text-transform: uppercase;
  text-align: center;
  margin-top: 12px;
  transition: opacity 0.5s;
}

.fms-dna-river { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

/* ── Tablet ── */
@media (min-width: 768px) {
  .fms-dna-quote { font-size: clamp(22px, 2.6vw, 30px); max-width: 560px; margin-bottom: 52px; }
  .fms-dna-diagram { max-width: 620px; }
  .fms-dna-label { font-size: 11px; min-width: 80px; }
  .fms-dna-row-bar { padding: 20px 0; }
  .fms-dna-explain-word { font-size: 11px; }
  .fms-dna-explain-desc { font-size: 14px; }
}

/* ── Desktop ── */
@media (min-width: 1024px) {
  .fms-dna-quote { font-size: clamp(26px, 2.2vw, 34px); max-width: 640px; margin-bottom: 60px; }
  .fms-dna-diagram { max-width: 700px; }
  .fms-dna-label { font-size: 12px; min-width: 96px; }
  .fms-dna-row-bar { padding: 24px 0; }
  .fms-dna-expand-inner { padding: 0 8px 28px; }
  .fms-dna-explain-word { font-size: 12px; }
  .fms-dna-explain-desc { font-size: 15px; max-width: 90%; }
}

/* ═══════════════════════════════════════
   FLOATING VINYL PLAYER (fixed corner)
   ═══════════════════════════════════════ */
.fms-vinyl-float {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9990;
  width: 56px;
  height: 56px;
  cursor: pointer;
}

.fms-vinyl-float-record {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #1a1a1a;
  position: relative;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.fms-vinyl-float-record::before {
  content: '';
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: repeating-radial-gradient(circle at center, transparent 0px, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 3px);
}

.fms-vinyl-float-record::after {
  content: '';
  position: absolute;
  top: 10%;
  left: 5%;
  width: 45%;
  height: 80%;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
  pointer-events: none;
}

.fms-vinyl-float-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 35%;
  height: 35%;
  border-radius: 50%;
  z-index: 2;
  border: 1px solid rgba(0,0,0,0.15);
}

.fms-vinyl-float-hole {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10%;
  height: 10%;
  border-radius: 50%;
  z-index: 3;
}

/* ═══ TONEARM ═══ */
.fms-vinyl-float-arm {
  position: absolute;
  top: -2px;
  right: 6px;
  width: 2px;
  height: 50%;
  background: rgba(255,255,255,0.35);
  border-radius: 1px;
  transform-origin: top center;
  transform: rotate(-30deg);
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10;
  pointer-events: none;
}

.fms-vinyl-float-arm::before {
  content: '';
  position: absolute;
  top: -3px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
}

.fms-vinyl-float-arm::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%) rotate(15deg);
  width: 4px;
  height: 8px;
  background: rgba(255,255,255,0.3);
  border-radius: 1px;
}

.fms-vinyl-float-arm.playing {
  transform: rotate(5deg);
}

.fms-vinyl-float-spin { animation: fms-vinylSpin 3s linear infinite; }
.fms-vinyl-float-spin.paused { animation-play-state: paused; }
@keyframes fms-vinylSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.fms-vinyl-float-status {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Inconsolata', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
}

.fms-vinyl-float:hover .fms-vinyl-float-record { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

/* Mobile: 56px */
@media (max-width: 767px) {
  .fms-vinyl-float { width: 56px; height: 56px; bottom: 20px; right: 20px; }
}

/* Tablet: 80px */
@media (min-width: 768px) {
  .fms-vinyl-float { width: 80px; height: 80px; bottom: 28px; right: 28px; }
  .fms-vinyl-float-status { font-size: 10px; bottom: -20px; }
}

/* Desktop: 100px */
@media (min-width: 1024px) {
  .fms-vinyl-float { width: 100px; height: 100px; bottom: 32px; right: 32px; }
  .fms-vinyl-float-status { font-size: 11px; bottom: -22px; }
}

/* ═══════════════════════════════════════
   INGREDIENTS
   ═══════════════════════════════════════ */

}

.fms-ingredients-intro {

.fms-ingredient-desc {

/* ═══════════════════════════════════════
   YOUR SCENT LABEL — bleeds into Zone 3

.fms-z3-label {

/* ═══ SCALE BARS ═══ */
.fms-scales { display: flex; flex-direction: column; gap: 14px; width: 100%; }
