<script>
(function () {
  function currentLang() {
    var p = location.pathname;
    if (p.indexOf('/fr/') !== -1) return 'fr';
    if (p.indexOf('/ru/') !== -1) return 'ru';
    return 'en';
  }
  function getResultPath() {
    var lang = currentLang();
    if (lang === 'fr') return '/fr/result';
    if (lang === 'ru') return '/ru/result';
    return '/result';
  }

  var LABELS = {
    en: { context: "You just finished the quiz — none of it asked for your name or email. Can we include your anonymous answers in fragrance research? No email or identifying info, ever.",
          agree: 'Agree & See My Result', decline: 'No Thanks — Just My Result' },
    fr: { context: "Vous venez de terminer le quiz — aucune question ne portait sur votre nom ou votre email. Pouvons-nous inclure vos réponses anonymes dans une recherche sur le parfum ? Jamais d'email ni d'info identifiable.",
          agree: "J'accepte, voir mon résultat", decline: 'Non merci, juste mon résultat' },
    ru: { context: 'Ты только что прошёл(а) тест — нигде не спрашивали ни имя, ни email. Можно ли использовать твои анонимные ответы в исследовании? Никогда никакого email или личных данных.',
          agree: 'Согласен(на), мой результат', decline: 'Нет, просто мой результат' }
  };

  const ARCHETYPES = ["CEO","HUG","OFFGRID","JAPAN","SUMMER","OUTOFTIME","THERAPIST"];
  const ANSWER_WEIGHTS = window.ANSWER_WEIGHTS;
  if (!ANSWER_WEIGHTS) {
    console.error("❌ ANSWER_WEIGHTS not found");
    return;
  }

  // ── Mirror open answer on every keystroke — robust on mobile, no mousedown fragility ──
  function attachOpenAnswerMirror() {
    var textarea = document.querySelector('textarea#field');
    if (!textarea) { setTimeout(attachOpenAnswerMirror, 300); return; }
    textarea.addEventListener('input', function () {
      var val = textarea.value.trim();
      sessionStorage.setItem('quiz_open', val);
      localStorage.setItem('quiz_open', val);
    });
  }
  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', attachOpenAnswerMirror)
    : attachOpenAnswerMirror();

  // ── Score immediately on page load (unchanged logic, including secondary) ──
  let answers = {};
  try {
    const raw = sessionStorage.getItem("quiz_answers") || localStorage.getItem("quiz_answers") || "{}";
    answers = JSON.parse(raw);
  } catch (e) {
    answers = {};
  }
  const scores = {};
  ARCHETYPES.forEach(a => scores[a] = 0);
  Object.values(answers).forEach(code => {
    const w = ANSWER_WEIGHTS[code];
    if (!w) return;
    ARCHETYPES.forEach(a => scores[a] += Number(w[a] || 0));
  });
  let maxScore = -Infinity;
  ARCHETYPES.forEach(a => { if (scores[a] > maxScore) maxScore = scores[a]; });
  const tied = ARCHETYPES.filter(a => scores[a] === maxScore);
  const winner = tied[Math.floor(Math.random() * tied.length)];
  let secondary = null;
  const TIE_THRESHOLD = 3;
  ARCHETYPES.forEach(a => {
    if (a === winner) return;
    if (Math.abs(scores[a] - scores[winner]) <= TIE_THRESHOLD) {
      if (!secondary || scores[a] > scores[secondary]) secondary = a;
    }
  });
  sessionStorage.setItem("quiz_result", winner);
  sessionStorage.setItem("quiz_secondary", secondary || "");
  sessionStorage.setItem("quiz_scores", JSON.stringify(scores));
  localStorage.setItem("quiz_result", winner);
  localStorage.setItem("quiz_secondary", secondary || "");
  localStorage.setItem("quiz_scores", JSON.stringify(scores));
  sessionStorage.removeItem("quiz_sent");
  console.log("✅ winner:", winner, scores);

  // ── Consent buttons replace Webflow's native Send button entirely ──
  function proceedToResult(consentAggregate) {
    var textarea = document.querySelector('textarea#field');
    var open_answer = textarea ? textarea.value.trim() : '';
    sessionStorage.setItem('quiz_open', open_answer);
    localStorage.setItem('quiz_open', open_answer);
    localStorage.setItem('consent_aggregate', consentAggregate ? 'true' : 'false');
    sessionStorage.removeItem('quiz_sent');
    window.location.href = getResultPath();
  }

  function buildConsentUI() {
    var nativeBtn = document.querySelector('.submit-button');
    if (!nativeBtn) { setTimeout(buildConsentUI, 300); return; }

    var lang = currentLang();
    var L = LABELS[lang] || LABELS.en;

    // Hide Webflow's native button — we never let it submit anything
    nativeBtn.style.display = 'none';

var style = document.createElement('style');
style.textContent = [
  '.fms-consent-wrap{margin-top:24px;margin-bottom:90px;display:flex;flex-direction:column;align-items:center;text-align:center;}',
  '.fms-consent-context{font-family:"Inconsolata",monospace;font-size:18px;line-height:1.75;letter-spacing:0.015em;color:#4a4a4a;margin-bottom:24px;max-width:60ch;}',
  '.fms-consent-buttons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}',
  '.fms-consent-btn{box-sizing:border-box;padding:15px 30px;border-radius:2px;font-family:"Inconsolata",monospace;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:none;transition:opacity 0.2s, background 0.2s, border-color 0.2s;}',
  '.fms-consent-agree{background:#e0d6a2;color:#272727;}',
  '.fms-consent-decline{background:transparent;color:#4a4a4a;border:1px solid rgba(0,0,0,0.28);}',
  '.fms-consent-agree:hover{opacity:0.85;}',
  '.fms-consent-decline:hover{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.42);}',
    '@media (max-width:768px){',
  '  .fms-consent-wrap{margin-bottom:140px;}',
  '}',
  '@media (max-width:480px){',
  '  .fms-consent-buttons{flex-direction:column;width:100%;}',
  '  .fms-consent-btn{width:100%;padding:16px 20px;font-size:12px;}',
  '  .fms-consent-context{font-size:16px;max-width:none;}',
  '  .fms-consent-wrap{margin-bottom:160px;}',
  '}'

].join('\n');
document.head.appendChild(style);

    var wrap = document.createElement('div');
    wrap.className = 'fms-consent-wrap';
    wrap.innerHTML =
      '<div class="fms-consent-context">' + L.context + '</div>' +
      '<div class="fms-consent-buttons">' +
        '<button type="button" class="fms-consent-btn fms-consent-agree">' + L.agree + '</button>' +
        '<button type="button" class="fms-consent-btn fms-consent-decline">' + L.decline + '</button>' +
      '</div>';
    nativeBtn.parentNode.insertBefore(wrap, nativeBtn.nextSibling);

    wrap.querySelector('.fms-consent-agree').addEventListener('click', function(){ proceedToResult(true); });
    wrap.querySelector('.fms-consent-decline').addEventListener('click', function(){ proceedToResult(false); });
  }
  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', buildConsentUI)
    : buildConsentUI();
})();
</script>
