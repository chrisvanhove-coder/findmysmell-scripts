<!-- ==================== Q_CELEBRATE_EN ==================== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const overlay = document.createElement('div');
  overlay.id = 'open-answer-overlay';
  overlay.style.cssText = `display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;`;
  overlay.innerHTML = `<div style="background:rgba(255,255,255,0.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.25);border-radius:28px;padding:48px 36px 40px;max-width:480px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3);"><p style="font-family:Georgia,serif;font-size:20px;margin-bottom:28px;color:#fff;letter-spacing:0.02em;line-height:1.5;">What did celebration smell like to you?</p><input id="open-answer-input" type="text" placeholder="Type your answer..." style="width:100%;padding:16px 20px;font-size:16px;font-family:Georgia,serif;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.35);border-radius:50px;outline:none;color:#fff;box-sizing:border-box;letter-spacing:0.03em;"><button id="open-answer-submit" style="margin-top:16px;width:100%;padding:16px;background:rgba(255,255,255,0.18);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:50px;font-size:14px;cursor:pointer;font-family:Georgia,serif;letter-spacing:0.14em;text-transform:uppercase;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.28)'" onmouseout="this.style.background='rgba(255,255,255,0.18)'">Continue →</button></div>`;
  document.body.appendChild(overlay);
  function attachOpenAnswerListener() {
    const btn = document.querySelector('[data-open-answer="true"]');
    if (!btn) return;
    btn.addEventListener('click', function(e) {
      e.preventDefault(); e.stopImmediatePropagation();
      overlay.style.display = 'flex';
      setTimeout(() => document.getElementById('open-answer-input').focus(), 50);
    });
  }
  attachOpenAnswerListener();
  document.getElementById('open-answer-submit').addEventListener('click', function() {
    const text = document.getElementById('open-answer-input').value.trim();
    if (!text) return;
    sessionStorage.setItem('quiz_open', text); localStorage.setItem('quiz_open', text);
    const answers = JSON.parse(sessionStorage.getItem('quiz_answers') || '{}');
    answers['Q_CELEBRATE'] = 'Q_CELEBRATE_OTHER';
    sessionStorage.setItem('quiz_answers', JSON.stringify(answers));
    window.location.href = '/q-calm-now';
  });
  document.getElementById('open-answer-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('open-answer-submit').click(); });
});
</script>

<script>
(function() {

  const imageMap = {
    'Q_CELEBRATE__SWEET':      'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357820/celeb-sweet_nvmyad.png',
    'Q_CELEBRATE__FRSH_FRUIT': 'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357803/celeb-fruits_fekby4.png',
    'Q_CELEBRATE__SPICES':     'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357816/celeb-spice_mfkpjy.png',
    'Q_CELEBRATE__PERFUME':    'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357787/celeb-adult_j0xahg.png',
    'Q_CELEBRATE__FUZZY':      'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357811/celeb-soda_w9vkai.png',
    'Q_CELEBRATE__NIGHT':      'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357807/celeb-night_klf4w2.png',
    'Q_CELEBRATE__SAVORY':     'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357791/celeb-bbq_rzvseo.png',
    'Q_CELEBRATE__DINING_OUT': 'https://res.cloudinary.com/dcefrxxav/image/upload/c_limit,w_1400/f_auto/q_auto/v1776357795/celeb-dine_xkkjhs.png'
  };

  const bg = document.createElement('div');
  bg.style.cssText = `
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.7s ease;
    pointer-events: none;
  `;
  document.body.appendChild(bg);

  const section = document.querySelector('[data-question-id="Q_CELEBRATE"]');
  if (section) {
    section.style.position = 'relative';
    section.style.zIndex = '1';
  }

  Object.values(imageMap).forEach(url => {
    const img = new Image();
    img.src = url;
  });

  let currentKey = null;
  let fadeOutTimer = null;
  let activeTouchKey = null;

  const isMobile = () => window.matchMedia('(hover: none)').matches;

  const buttons = document.querySelectorAll('[data-answer-key^="Q_CELEBRATE"]');

  function showImage(key) {
    if (!imageMap[key]) return;
    clearTimeout(fadeOutTimer);
    bg.style.backgroundImage = `url('${imageMap[key]}')`;
    bg.style.opacity = '1';
    currentKey = key;
  }

  function hideImage() {
    fadeOutTimer = setTimeout(() => {
      bg.style.opacity = '0';
      currentKey = null;
    }, 200);
  }

  function dimOthers(activeBtn) {
    buttons.forEach(b => {
      b.style.opacity = b === activeBtn ? '1' : '0.4';
      b.style.transition = 'opacity 0.3s ease';
    });
  }

  function resetAll() {
    buttons.forEach(b => { b.style.opacity = '1'; });
  }

  buttons.forEach(btn => {
    const key = btn.getAttribute('data-answer-key');

    btn.addEventListener('mouseenter', () => {
      if (isMobile()) return;
      showImage(key);
      dimOthers(btn);
    });

    btn.addEventListener('mouseleave', () => {
      if (isMobile()) return;
      resetAll();
      hideImage();
    });

    btn.addEventListener('touchstart', (e) => {
      if (!isMobile()) return;
      if (activeTouchKey !== key) {
        e.preventDefault();
        activeTouchKey = key;
        showImage(key);
        dimOthers(btn);
      }
    }, { passive: false });
  });

  document.addEventListener('touchstart', (e) => {
    if (!isMobile()) return;
    const tappedButton = e.target.closest('[data-answer-key^="Q_CELEBRATE"]');
    if (!tappedButton) {
      activeTouchKey = null;
      resetAll();
      hideImage();
    }
  });

})();
</script>
